<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Ilustrasi rak koleksi Mochibako dengan maskot kotak dan bintang">
  <defs>
    <pattern id="shelf-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1B2430" stroke-opacity="0.06" stroke-width="2"/>
    </pattern>
    <pattern id="shelf-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#1B2430" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="#F6F3EC"/>
  <rect width="1600" height="640" fill="url(#shelf-grid)"/>
  <rect x="960" y="0" width="640" height="640" fill="url(#shelf-dots)"/>

  <!-- Lingkaran utama -->
  <circle cx="1190" cy="300" r="252" fill="#FFD9E6" stroke="#1B2430" stroke-width="10"/>
  <circle cx="1190" cy="300" r="184" fill="#FFE9B8" stroke="#1B2430" stroke-width="8" stroke-dasharray="20 16"/>
  <circle cx="1190" cy="300" r="112" fill="#F4B942" stroke="#1B2430" stroke-width="9"/>

  <!-- Awan -->
  <path d="M958 168c0-30 24-54 54-54 8-32 36-54 70-54 38 0 70 28 74 65 26 4 46 26 46 52 0 30-24 54-54 54H1004c-26 0-46-20-46-46v-17z"
        fill="#FFFFFF" stroke="#1B2430" stroke-width="9" stroke-linejoin="round"/>

  <!-- Bintang dekoratif -->
  <path d="M1438 108l16 38 41 4-31 27 9 40-35-21-35 21 9-40-31-27 41-4z"
        fill="#F4B942" stroke="#1B2430" stroke-width="8" stroke-linejoin="round"/>
  <path d="M908 402l12 28 30 3-23 20 7 30-26-16-26 16 7-30-23-20 30-3z"
        fill="#D4C2F5" stroke="#1B2430" stroke-width="7" stroke-linejoin="round"/>
  <path d="M1500 402l10 24 26 3-20 17 6 26-22-14-22 14 6-26-20-17 26-3z"
        fill="#B8EBD0" stroke="#1B2430" stroke-width="7" stroke-linejoin="round"/>

  <!-- Kilau -->
  <path d="M1024 300l10-26 10 26 26 10-26 10-10 26-10-26-26-10z" fill="#FFFFFF" stroke="#1B2430" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1342 172l8-20 8 20 20 8-20 8-8 20-8-20-20-8z" fill="#FFFFFF" stroke="#1B2430" stroke-width="6" stroke-linejoin="round"/>

  <!-- Rak -->
  <rect x="1040" y="522" width="372" height="30" rx="15" fill="#F4B942" stroke="#1B2430" stroke-width="9"/>

  <!-- Maskot kotak -->
  <g transform="translate(1226 400) rotate(-6)">
    <line x1="0" y1="-86" x2="0" y2="-126" stroke="#1B2430" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 -168l11 28 30 3-23 20 7 30-25-16-25 16 7-30-23-20 30-3z"
          fill="#FFB7CE" stroke="#1B2430" stroke-width="7" stroke-linejoin="round"/>
    <rect x="-92" y="-88" width="184" height="176" rx="38" fill="#B8EBD0" stroke="#1B2430" stroke-width="10"/>
    <circle cx="-36" cy="-20" r="10" fill="#1B2430"/>
    <circle cx="36" cy="-20" r="10" fill="#1B2430"/>
    <circle cx="-60" cy="12" r="11" fill="#FFB7CE"/>
    <circle cx="60" cy="12" r="11" fill="#FFB7CE"/>
    <path d="M-22 16Q0 40 22 16" fill="none" stroke="#1B2430" stroke-width="9" stroke-linecap="round"/>
    <path d="M-62 44l-8 18M62 44l8 18" fill="none" stroke="#1B2430" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Kabut lembut di sisi kiri agar teks tetap terbaca -->
  <rect x="0" y="0" width="880" height="640" fill="url(#shelf-grid)" opacity="0"/>
</svg>
